          <!-- Stage 1: pick a format -->
          <template v-if="exportSheet.stage === 'pick'">
            <button class="exp-opt" :disabled="!exportHasImages" @click="chooseExportFormat('minibook')">
              <svg class="exp-ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/></svg>
              <span class="exp-opt-text">
                <strong>Mini-Book</strong>
                <small v-if="exportHasImages">Print 2-sided, then cut &amp; staple a real 3½-inch book. {{ exportMiniSheets }} sheet{{ exportMiniSheets === 1 ? '' : 's' }} of paper.</small>
                <small v-else>Needs pictures — this story was made without them.</small>
              </span>
            </button>
            <button class="exp-opt" @click="chooseExportFormat('storyboard')">
              <svg class="exp-ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/></svg>
              <span class="exp-opt-text">
                <strong>Storyboard</strong>
                <small>One-sided handout — pictures beside words. No assembly.</small>
              </span>
            </button>
          </template>

          <!-- Stage 2: live preview of every sheet -->
          <template v-else>
            <div v-if="exportSheet.busy" class="exp-busy">
              <div class="loading-spinner small"></div>
              <div class="exp-busy-text">{{ exportSheet.progressText }}</div>
            </div>
            <template v-else-if="exportSheet.error">
              <div class="exp-error">{{ exportSheet.error }}</div>
            </template>
            <template v-else>
              <div class="exp-stage">
                <div class="exp-strip" ref="expStrip" @scroll.passive="onExportScroll">
                  <canvas v-for="i in exportSheet.sheetCount" :key="'xc' + i" :ref="el => setExportCanvas(i - 1, el)" class="exp-canvas" width="612" height="792"></canvas>
                </div>
                <div class="exp-dots"><i v-for="i in exportSheet.sheetCount" :key="'xd' + i" :class="{ on: i - 1 === exportSheet.current }"></i></div>
                <div class="exp-cap">{{ exportSheetCaption }}</div>
              </div>
              <div class="exp-btnrow">
                <button class="exp-btn gold" @click="exportPrimary">
                  <svg class="tb-ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 6 2 18 2 18 9"/><path d="M6 18H4a2 2 0 0 1-2-2v-5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2h-2"/><rect x="6" y="14" width="12" height="8"/></svg>{{ exportCanShareFiles ? 'Print / Share' : 'Print' }}
                </button>
                <button v-if="!exportCanShareFiles" class="exp-btn ghost" @click="exportSecondary">
                  <svg class="tb-ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>Save PDF
                </button>
                <button v-else-if="exportSheet.format === 'minibook'" class="exp-btn ghost" @click="showHowTo = true">
                  <svg class="tb-ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><line x1="12" y1="16" x2="12" y2="12"/><line x1="12" y1="8" x2="12.01" y2="8"/></svg>How to build
                </button>
              </div>
              <button v-if="exportSheet.format === 'minibook' && !exportCanShareFiles" class="exp-howto-link" @click="showHowTo = true">ⓘ &nbsp;How to build it</button>
            </template>
          </template>
        </div>
      </div>

      <!-- How to build the Mini-Book (never printed — lives here) -->
      <div v-if="showHowTo" class="exp-overlay" @click.self="showHowTo = false">
        <div class="exp-card exp-howto-card">
          <div class="exp-head">
            <h3>How to build your Mini-Book</h3>
            <button class="exp-close" @click="showHowTo = false" aria-label="Close">✕</button>
          </div>
          <div class="hw-step"><span class="hw-n">1</span><div><strong>Print 2-sided</strong><p>Choose two-sided, <b>flip on long edge</b>, at <b>100% scale</b> ("Actual size"). Plain paper is fine — card stock makes a sturdier cover.</p></div></div>
          <div class="hw-step"><span class="hw-n">2</span><div><strong>Cut the grid</strong><p>Cut with the lined side up: trim the white border, then cut the six pages apart along the dotted lines.</p></div></div>
          <div class="hw-step"><span class="hw-n">3</span><div><strong>Stack by the numbers</strong><p>Cover on top, then follow the small numbers in the margin — 2, 3, 4… in order, numbers on the left, facing up.</p></div></div>
          <div class="hw-step"><span class="hw-n">4</span><div><strong>Staple the spine</strong><p>Two staples through the <b>gold marks</b> on the cover's dark spine band. Any desk stapler reaches. That's it — a real little book!</p></div></div>
          <button class="exp-btn gold hw-done" @click="showHowTo = false">Got it</button>
        </div>
      </div>

      <!-- ============== PICTURE GALLERY ============== -->
      <div v-if="showGallery" class="gallery-view">
        <div class="gallery-bar">
          <button @click="closeGallery" class="header-back-btn" aria-label="Back to settings" title="Back to settings">‹</button>
          <div class="search-wrap gallery-search-wrap">
            <svg class="search-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><line x1="20" y1="20" x2="16.65" y2="16.65"/></svg>
            <input type="text" v-model="gallerySearch" @input="loadGalleryThumbs" placeholder="Search pictures…" class="text-input library-search" />
            <button v-if="gallerySearch" @click="gallerySearch = ''" class="search-clear" aria-label="Clear search">✕</button>
          </div>
          <button @click="galleryShowFilters = !galleryShowFilters" :class="['bar-icon-btn', { 'filter-active': galleryShowFilters || galleryAnyFilter }]" title="Filter &amp; sort" aria-label="Filter and sort">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 5h18l-7 8v6l-4 2v-8z"/></svg>
          </button>
        </div>

        <!-- filter / sort panel, same shape as the library's -->
        <div v-if="galleryShowFilters" class="filter-panel">
          <div class="filter-row"><span>Group by</span>
            <select v-model="gallerySort" class="select-input">
              <option value="story">Story (newest first)</option>
              <option value="style">Art style</option>
              <option value="character">Character</option>
            </select>
          </div>
          <div v-if="galleryStyleOptions.length" class="facc-item">
            <button :class="['facc-bar', { open: openFilter === 'gstyle' }]" @click="toggleFilterOpen('gstyle')">
              <span class="facc-name">Art style</span>
              <span class="facc-summary">{{ galleryStyleFilter ? galleryStyleLabel(galleryStyleFilter) : 'All' }}</span>
              <span class="facc-caret">▾</span>
            </button>
            <div v-if="openFilter === 'gstyle'" class="facc-list">
              <button :class="['facc-row', { on: !galleryStyleFilter }]" @click="galleryStyleFilter = ''">
                <span class="facc-row-label">All styles</span><span class="facc-row-check">{{ !galleryStyleFilter ? '✓' : '' }}</span>
              </button>
              <button v-for="s in galleryStyleOptions" :key="'gs-'+s.value" @click="galleryStyleFilter = s.value; loadGalleryThumbs()" :class="['facc-row', { on: galleryStyleFilter === s.value }]">
                <span class="facc-row-label"><span class="facc-row-emoji">{{ s.emoji }}</span>{{ s.label }} <span class="facc-count">{{ s.count }}</span></span>
                <span class="facc-row-check">{{ galleryStyleFilter === s.value ? '✓' : '' }}</span>
              </button>
            </div>
          </div>
          <div v-if="galleryCharOptions.length" class="facc-item">
            <button :class="['facc-bar', { open: openFilter === 'gchar' }]" @click="toggleFilterOpen('gchar')">
              <span class="facc-name">Character</span>
              <span class="facc-summary">{{ galleryCharFilter || 'All' }}</span>
              <span class="facc-caret">▾</span>
            </button>
            <div v-if="openFilter === 'gchar'" class="facc-list">
              <button :class="['facc-row', { on: !galleryCharFilter }]" @click="galleryCharFilter = ''">
                <span class="facc-row-label">All characters</span><span class="facc-row-check">{{ !galleryCharFilter ? '✓' : '' }}</span>
              </button>
              <button v-for="c in galleryCharOptions" :key="'gc-'+c.name" @click="galleryCharFilter = c.name; loadGalleryThumbs()" :class="['facc-row', { on: galleryCharFilter === c.name }]">
                <span class="facc-row-label">{{ c.name }} <span class="facc-count">{{ c.count }}</span></span>
                <span class="facc-row-check">{{ galleryCharFilter === c.name ? '✓' : '' }}</span>
              </button>
            </div>
          </div>
          <button v-if="galleryAnyFilter" @click="clearGalleryFilters" class="btn-secondary filter-reset-btn">↺ Reset</button>
        </div>

        <!-- not prepared yet -->
        <div v-if="!galleryAll.length" class="gallery-empty">
          <div class="empty-emoji">🖼️</div>
          <div class="empty-title">Gallery not ready yet</div>
          <div class="empty-text">Open <strong>Settings › Library &amp; Storage</strong> and tap <strong>Prepare gallery</strong> to collect every picture you've made. Best on wifi — it only needs doing once.</div>
        </div>
        <div v-else-if="!galleryCount" class="gallery-empty">
          <div class="empty-emoji">🔍</div>
          <div class="empty-title">No pictures match</div>
          <div class="empty-text">Try a different word, or reset the filters.</div>
        </div>

        <div v-else class="gallery-scroll">
          <p class="gallery-count">
            {{ galleryCount }} picture{{ galleryCount === 1 ? '' : 's' }}
            <span v-if="gallerySyncing" class="gallery-syncing">· adding {{ gallerySyncDone }}/{{ gallerySyncTotal }} more books…</span>
          </p>
          <div v-for="g in galleryGroups" :key="'gg-'+g.key" class="gallery-group">
            <div class="gallery-group-head">
              <span class="ggh-title">{{ g.label }}</span>
              <span v-if="g.sub" class="ggh-sub">{{ g.sub }}</span>
              <span class="ggh-count">{{ g.items.length }}</span>
            </div>
            <div class="gallery-grid">
              <button v-for="e in g.items" :key="g.key + '-' + e.i" class="gallery-cell" @click="openGalleryImage(e)">
                <img v-if="galleryThumb(e)" :src="galleryThumb(e)" :alt="e.t" loading="lazy" draggable="false" @error="onGalleryThumbError(e, $event)" />
                <span v-else class="gallery-cell-ph">🖼️</span>
                <span v-if="e.p === 0" class="gallery-cell-badge">Cover</span>
              </button>
            </div>
          </div>
        </div>
      </div>

      <!-- ============== GALLERY LIGHTBOX ============== -->
      <div v-if="galleryLightbox" class="lightbox" @click.self="closeGalleryImage"
           @touchstart.passive="galleryTouchStart" @touchend="galleryTouchEnd">
        <button class="lightbox-close" @click="closeGalleryImage" aria-label="Close">✕</button>
        <button class="lightbox-nav lb-prev" @click.stop="stepGalleryImage(-1)" aria-label="Previous">‹</button>
        <button class="lightbox-nav lb-next" @click.stop="stepGalleryImage(1)" aria-label="Next">›</button>

        <div class="lightbox-inner" @click.stop>
          <div class="lightbox-imgwrap">
            <img v-if="galleryFullUrl" :src="galleryFullUrl" :alt="galleryLightbox.entry.t" draggable="false" />
            <div v-else class="loading-spinner small"></div>
          </div>
          <div class="lightbox-info">
            <button class="lb-title" @click="openGalleryStory(galleryLightbox.entry)">
              {{ galleryLightbox.entry.t }} <span class="lb-open">Open story ›</span>
            </button>
            <div class="lb-meta">
              <span>{{ galleryPageLabel(galleryLightbox.entry) }}</span>
              <span v-if="formatGalleryDate(galleryLightbox.entry.d)">· {{ formatGalleryDate(galleryLightbox.entry.d) }}</span>
            </div>
            <div class="lb-tags">
              <span class="lb-tag">{{ galleryStyleLabel(galleryLightbox.entry.a) }}</span>
              <span v-if="galleryLightbox.entry.g" class="lb-tag">{{ galleryGenreLabel(galleryLightbox.entry.g) }}</span>
            </div>
          </div>
        </div>
      </div>

    </template>
  </div>

  <!-- Self-hosted + version-pinned so the app boots and runs fully offline (the
       service worker caches same-origin assets; it can't cache cross-origin CDNs).
       Vue 3.5.40 · Cropper 1.5.13 · canvas-confetti 1.9.3 · GSAP 3.12.5 -->
  <script src="vendor/vue.global.js?v=1.2.3"></script>
  <script src="vendor/cropper.min.js?v=1.2.3"></script>
  <script src="vendor/canvas-confetti.min.js?v=1.2.3"></script>
  <script src="vendor/gsap.min.js?v=1.2.3"></script>
  <script src="js/storage.js?v=1.2.3"></script>
  <script src="js/imageStorage.js?v=1.2.3"></script>
  <script src="js/api.js?v=1.2.3"></script>
  <script src="js/sync.js?v=1.2.3"></script>
  <script src="js/pageShadow.js?v=1.2.3"></script>
  <script src="js/pageCurl.js?v=1.2.3"></script>
  <script src="js/export.js?v=1.2.3"></script>
  <script src="js/app.js?v=1.2.3"></script>

  <script>
    // Shared links are served from the Worker origin (cross-origin to sw.js) and
    // are one-time reads — skip the service worker entirely there.
    if ('serviceWorker' in navigator && !window.__SHARE__) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('sw.js')
          .then((reg) => {
            console.log('SW registered. Scope:', reg.scope);
            // Actively check for a new version on load and whenever the app is
            // brought back to the foreground (iOS PWAs otherwise update lazily).
            reg.update();
            document.addEventListener('visibilitychange', () => {
              if (document.visibilityState === 'visible') reg.update();
            });
            reg.addEventListener('updatefound', () => {
              const newWorker = reg.installing;
              if (!newWorker) return;
              newWorker.addEventListener('statechange', () => {
                if (newWorker.state === 'installed' && navigator.serviceWorker.controller) {
                  newWorker.postMessage({ type: 'SKIP_WAITING' });
                }
              });
            });
          })
          .catch((err) => console.error('SW registration failed:', err));

        let reloadedForUpdate = false;
        navigator.serviceWorker.addEventListener('controllerchange', () => {
          if (reloadedForUpdate) return;
          reloadedForUpdate = true;
          window.location.reload();
        });
      });
    }
  </script>

</body>
</html>
